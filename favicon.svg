<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    star-sparkle, outline weight, from Reicon (https://reicon.dev) — MIT.
    Drawn on Reicon's 24 x 24 grid; the inner group is on their 18-unit
    drawing grid and the scale carries it out to 24, exactly as shipped.

    Two things this file does that a favicon usually does not:

    A favicon renders as a STANDALONE document, so it inherits nothing from
    the page. currentColor here resolves against this file's own `color`,
    which is why the property is declared below rather than left to the page.

    And it answers the colour scheme. The system draws its chrome in the ink
    token, which is near-black on light stock and near-white on dark, so a
    fixed black mark would disappear in a dark tab strip. The two values below
    are the same greys the system uses (grey 950 and grey 100).

    Ink, not accent. The accent means "you are here" — a state, never an
    identity — so it cannot be the mark that names the site.

    No token names are written above, and that is a constraint of the format
    rather than a style choice: a double hyphen may not appear inside an XML
    comment, so "the ink token" is as close as this file can get. Written the
    obvious way it was a parse error on two lines and the icon did not render
    at all.
  -->
  <style>
    svg { color: #000000; }
    @media (prefers-color-scheme: dark) {
      svg { color: #f2f2f2; }
    }
  </style>

